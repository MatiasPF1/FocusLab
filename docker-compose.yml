services:
  frontend:
    build:
      context: ./frontend

    ports:
      - "3000:3000"

    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next

    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
      INTERNAL_API_URL: http://backend:8000

    depends_on:
      - backend

    command: npm run dev -- --hostname 0.0.0.0


  backend:
    build:
      context: ./backend

    ports:
      - "8000:8000"

    volumes:
      - ./backend:/app
      - backend_data:/app/data

    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload

volumes:
  backend_data:
