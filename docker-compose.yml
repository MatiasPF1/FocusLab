services:
  frontend:
    build:
      context: ./frontend

    ports:
      - "3000:3000"

    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next

    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
      INTERNAL_API_URL: http://backend:8000
      # Native filesystem change events don't cross the Windows -> Docker bind
      # mount, so Next.js never sees edits without this: it has to poll the
      # files instead. Without it, every change needs a manual container
      # restart, which wipes the dev server's compiled-route cache and makes
      # the next page you open cold-compile instead of navigating instantly.
      # Only takes effect under webpack (see --webpack below) - Turbopack, the
      # Next 16 default, ignores this entirely and has no polling flag of its
      # own yet, so it stays permanently blind to edits over this mount.
      WATCHPACK_POLLING: "true"
      CHOKIDAR_USEPOLLING: "true"

    depends_on:
      - backend

    # --webpack: Turbopack (the default) doesn't support the polling env vars
    # above, so it can never see edits made from Windows through this mount.
    command: npm run dev -- --hostname 0.0.0.0 --webpack


  backend:
    build:
      context: ./backend

    ports:
      - "8000:8000"

    volumes:
      - ./backend:/app
      - backend_data:/app/data

    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload

volumes:
  backend_data:


